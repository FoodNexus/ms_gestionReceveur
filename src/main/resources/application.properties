# --- Nom du microservice ---
spring.application.name=ms-receveur
server.port=8080

# --- Base de données MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_receveur?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Service Discovery (Eureka) ---
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Sécurité & Keycloak (OAuth2 Resource Server) ---
# Remplacez {VOTRE_REALM} par le nom de votre realm Keycloak (ex: foodnexus-realm)
# Remplacez 8180 par le port de votre Keycloak s'il est différent de 8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/{VOTRE_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/{VOTRE_REALM}/protocol/openid-connect/certs

# --- Configuration facultative pour Feign (Si utilisé) ---
# Permet de voir les logs des appels vers les autres services (Donneur, etc.)
logging.level.tn.esprit.ms_receveur.clients=DEBUG
